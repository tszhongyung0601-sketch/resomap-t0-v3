<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResoMap</title>
    <!--
      GitHub Pages serves this for any path it cannot find under the base.

      This app has no URL router — the route stack lives in App.tsx's state and
      the address bar never changes — so nothing here should ever be reachable
      by normal use. It exists so a mistyped or stale link lands back in the app
      instead of on GitHub's own 404 page, which is a dead end wearing somebody
      else's branding.

      If a real router is ever added, this has to preserve the pathname
      (sessionStorage hand-off) or the app has to move to hash routing.
    -->
    <meta http-equiv="refresh" content="0; url=/resomap-t0-v3/" />
    <script>
      window.location.replace("/resomap-t0-v3/");
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; padding: 2rem; color: #5c584f">
    <p>找不到這個頁面，正在回到 <a href="/resomap-t0-v3/">ResoMap</a>……</p>
  </body>
</html>
